<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="45%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <radialGradient id="sunB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="256" fill="url(#bgB)"/>

  <!-- Sun glow -->
  <circle cx="256" cy="205" r="130" fill="url(#sunB)" opacity="0.7"/>
  <circle cx="256" cy="205" r="55" fill="#fef3c7" opacity="0.9"/>

  <!-- Mountain silhouette -->
  <path d="M 0 512 L 0 400 L 90 320 L 170 380 L 256 300 L 340 375 L 430 315 L 512 395 L 512 512 Z"
        fill="#7c2d12" opacity="0.85"/>

  <!-- Sakura branch top-left -->
  <g stroke="#431407" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M 0 60 Q 60 80, 130 60"/>
    <path d="M 40 66 Q 55 45, 70 40"/>
    <path d="M 90 60 Q 100 40, 115 30"/>
  </g>
  <g fill="#fbcfe8" stroke="#f472b6" stroke-width="1.5">
    <circle cx="25" cy="60" r="10"/>
    <circle cx="70" cy="40" r="11"/>
    <circle cx="115" cy="30" r="9"/>
    <circle cx="128" cy="58" r="10"/>
    <circle cx="55" cy="72" r="8"/>
  </g>

  <!-- Falling petals -->
  <g fill="#fbcfe8" opacity="0.85">
    <ellipse cx="420" cy="120" rx="7" ry="12" transform="rotate(-30 420 120)"/>
    <ellipse cx="440" cy="200" rx="6" ry="10" transform="rotate(20 440 200)"/>
    <ellipse cx="60" cy="250" rx="7" ry="11" transform="rotate(50 60 250)"/>
  </g>

  <!-- Bold ASIAN text -->
  <text x="256" y="290" text-anchor="middle"
        font-family="'Arial Black', Impact, sans-serif"
        font-weight="900" font-size="94" fill="#ffffff"
        stroke="#7f1d1d" stroke-width="3"
        letter-spacing="6">ASIAN</text>
  <text x="256" y="345" text-anchor="middle"
        font-family="'Arial Black', Impact, sans-serif"
        font-weight="900" font-size="42" fill="#fef3c7"
        letter-spacing="12">MARKET</text>
</svg>
